# Task config: ARCADE stenosis DETECTION (multi-lesion subset, >=2 lesions/image)
# Input  = one 512x512 XCA frame (image.png)
# Output = instance list {label="stenosis", bbox, mask} — location only, no percent
# Metric = mean F1 per image (ARCADE official) — scoring wired later
run_name: arcade_stenosis
seed: 42

tasks:
  source: ../../data/tasks/arcade_stenosis/cases
  case_glob: "case_*"

agent:
  backend: mock
  name: mock-arcade-sten
  model: mock-model

judge:
  backend: mock
  model: mock-judge
  mock_grade: A

output:
  root: ../../runs
  reruns: 1

rubric:
  # Rubric is DEFERRED (input/output focus). This points at the existing
  # dimensions file only so the orchestrator initializes; not used for scoring yet.
  dimensions_file: ../../rubrics/rubric_dimensions.yaml
  default_case_rubric: null
