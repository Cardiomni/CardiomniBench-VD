# =============================================================================
expected_output:
  format: "prose_report"
  required_sections:
    - "dominance"
    - "per_segment_findings"
  optional_sections:
    - "lesion_locations"

  example_report: |
    冠脉分布为右优势型。
    1. 左冠状动脉:
       (a) 左主干:未见狭窄
       (b) 前降支:近端狭窄60%,第一对角支未见狭窄
       (c) 回旋支:未见明显狭窄
    2. 右冠状动脉:近段狭窄75%

